apiVersion: v1
kind: Service
metadata:
  name: my-cni-metrics
  namespace: kube-system
  labels:
    app: my-cni
spec:
  selector:
    app: my-cni
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
  clusterIP: None
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: my-cni
  namespace: kube-system
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: my-cni
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
